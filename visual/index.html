<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control de Riego Automatizado | Orquidia</title>
    
    
    <link rel="stylesheet" href="Visual.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
     <style>
        body { font-family: sans-serif; padding: 20px; }
        .text-orchid-primary { color: #585858; } 
        h1 { border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        h2 { margin-top: 0; color: #4CAF50; }
        form { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 30px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input[type="text"], input[type="date"], input[type="number"], textarea {
            width: 100%; padding: 8px; margin: 5px 0 15px 0; display: inline-block; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #e0e0e0; }

       .chart-container {
            height: 70vh; 
            max-width: 95%;
            margin: 0 auto;
            background-color: white;
        }
        #temperaturaHumedadChart {
            max-height: 100%;
        }
        .icon-svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Encabezado del Panel de Control -->
    <header class="mb-8 text-center">
        <h1 class="text-4xl font-extrabold text-orchid-primary mb-2">Orqui-Riego</h1>
        <p class="text-gray-500">Panel de Control de Riego Automatizado</p>
        <div id="iotStatus" class="mt-2 text-sm font-medium p-1 rounded-full inline-block">
        </div>
    </header>

    <!-- Formulario de Registro de Orquídea -->
    <form action="/agregar_orquidea" method="POST">
        <h3>Registro de Orquídea</h3>
        
        <label for="nombre">Nombre de la orquídea:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Phalaenopsis, Cattleya..." required>
        
        <label for="ultima_fecha">Última fecha de riego:</label>
        <input type="date" id="ultima_fecha" name="ultima_fecha" placeholder="dd/mm/aaaa">
        
        <label for="frecuencia">Frecuencia de riego (días):</label>
        <input type="number" id="frecuencia" name="frecuencia" placeholder="Ej: 7" min="1" required>
        
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones" rows="3" placeholder="Notas sobre el estado, fertilizante, etc."></textarea>

        <button type="submit">agregar</button>
    </form>

    <hr>

    <!-- Lista de Orquídeas -->
    <div id="lista_orquideas" class="mb-10">
        <h3>Orquídeas Registradas</h3>
        <p>Cargando datos...</p>
    </div>

    <!-- Sección de Sensores en Vivo -->
    <section class="mb-10">
        <h2 class="text-2xl font-semibold mb-4 text-gray-700">Datos de Sensores en Vivo</h2>
        <div id="sensorDashboard" class="grid grid-cols-2 gap-4 md:grid-cols-4">

            <!-- Placeholder para Humedad del Aire (Primer SVG) -->
            <div class="card p-4 bg-white rounded-xl flex flex-col items-center justify-center text-center">
                <div class="text-blue-500 mb-2">
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21a9 9 0 0 1-9-9c0-5.59 7-14 9-14s9 8.41 9 14a9 9 0 0 1-9 9zm0-16.74c-1.35 1.76-4 5.92-4 9.74a4 4 0 0 0 8 0c0-3.82-2.65-7.98-4-9.74z"/></svg>
                </div>
               
            
            <!-- Sensor de Temperatura -->
            <div class="card p-4 bg-white rounded-xl flex flex-col items-center justify-center text-center">
                <div class="text-red-500 mb-2">
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 5.5V21h8v-5.5c1.5-1 3-3 3-5.5a7 7 0 0 0-7-7zm0 15v-3.5c-1.84-.79-3-2.73-3-5.07 0-2.47 2.03-4.5 4.5-4.5S16.5 7.96 16.5 10c0 2.34-1.16 4.28-3 5.07V18H12z"/></svg>
                </div>
                <p class="text-sm text-gray-500">Temperatura</p>
                <p id="temperature" class="text-2xl font-bold text-gray-800">- °C</p>
            </div>

            <!-- Sensor de Humedad del Suelo -->
            <div class="card p-4 bg-white rounded-xl flex flex-col items-center justify-center text-center">
                <div class="text-yellow-600 mb-2">
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zM16.5 1.5v3h-3v-3h3zM16.5 19.5v3h-3v-3h3zM7.5 1.5v3h-3v-3h3zM7.5 19.5v3h-3v-3h3zM19.5 7.5h3v-3h-3v3zM19.5 16.5h3v-3h-3v3zM1.5 7.5h3v-3h-3v3zM1.5 16.5h3v-3h-3v3z"/></svg>
                </div>
                <p class="text-sm text-gray-500">Humedad del Suelo</p>
                <p id="soilMoisture" class="text-2xl font-bold text-gray-800">- %</p>
                <span id="waterStatus" class="text-xs px-2 py-1 rounded-full"></span>
            </div>
            
        </div>
    </section>

    <hr class="my-6">
    
    <!-- 📈 SECCIÓN DE GRÁFICO (El nuevo componente) 📈 -->
    <section class="mt-10 mb-10">
        <h2 class="text-2xl font-semibold mb-4 text-gray-700">Histórico: Datos de Sensores (Cada 3 Minutos)</h2>
        <div class="chart-container p-4 rounded-xl shadow-lg border border-gray-200">
            <!-- 🚨 El CANVAS: Contenedor para el gráfico 🚨 -->
            <canvas id="temperaturaHumedadChart"></canvas>
        </div>
    </section>


    <!-- 
        =======================================================
        INCLUSIÓN DE LIBRERÍAS Y SCRIPTS
        =======================================================
    -->
    
    <!-- Script de lógica principal del usuario -->
    <script src="script.js"></script> 

    <!-- 1. Librería Base de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 2. Adaptador de Fecha: Necesario para 'type: time' -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    
    <!-- 3. Tu Lógica de Gráfico -->
    <script src="visual/chart.js"></script> 

</body>
</html>
